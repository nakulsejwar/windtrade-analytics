services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      # Optional: point at a different snapshot file
      - SNAPSHOT_PATH=/srv/backend/data/wind_2026-01.json.gz
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
